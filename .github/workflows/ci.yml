name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages (OCR + fonts for the video)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: Web app syntax
        run: node --check web/app.js && node --check web/sw.js
      - name: Data files are valid JSON
        run: for f in backend/app/data/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t labelcheck:ci .
      - name: Smoke test
        run: |
          docker run -d --name lc -p 8000:8000 labelcheck:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/v1/health && break; sleep 1; done
          curl -fs localhost:8000/api/v1/health | grep '"status":"ok"'
          curl -fs -o /dev/null localhost:8000/
          docker logs lc
